<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
</head>
<body>
  <header class="site-header{% if page.url == '/' %} is-home{% endif %}" style="background-image: url('{{ '/images/feature-header.jpg' | relative_url }}')">
    <div class="site-header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">escritos</a>
        <span aria-hidden="true">·</span>
        <a href="{{ '/temas/' | relative_url }}">temas</a>
        <span aria-hidden="true">·</span>
        <a href="{{ '/sobremi/' | relative_url }}">sobre mí</a>
      </nav>
      {%- if page.url == '/' %}
      <p class="tagline"><span>{{ site.tagline }}</span></p>
      {%- endif %}
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: "%Y" }} {{ site.author }}</span>
    <span aria-hidden="true">·</span>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </footer>
</body>
</html>
