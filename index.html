---
layout: default
title: Escritos
---
<section class="intro">
  <p class="tagline">{{ site.tagline }}</p>
</section>

<ul class="post-list">
  {%- for p in site.posts %}
  <li>
    <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
    <span class="tag">{% for t in p.tags limit:1 %}{{ site.tag_names[t] | default: t }}{% endfor %}</span>
  </li>
  {%- endfor %}
</ul>
